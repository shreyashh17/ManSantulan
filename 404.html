<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found • ManSantulan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">

  <div class="auth-card" style="text-align: center; max-width: 500px;">
    <div style="font-size: 4rem; margin-bottom: var(--space-2);">🌿</div>
    <span style="font-size: 3.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--sage-dark); line-height: 1;">404</span>
    <h1 style="font-size: 1.5rem; font-weight: 700; margin: var(--space-3) 0 var(--space-2);">Lost your way? Take a deep breath.</h1>
    <p style="color: var(--text-secondary); margin-bottom: var(--space-6); font-size: 0.95rem;">
      The page you are looking for doesn't exist or may have been relocated. Let's guide you back to calm waters.
    </p>
    <div style="display: flex; flex-direction: column; gap: var(--space-3);">
      <a href="index.html" class="btn btn-primary btn-full">Return to Dashboard</a>
      <a href="login.html" class="btn btn-secondary btn-full">Sign In</a>
    </div>
  </div>

</body>
</html>
