<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ManSantulan (मन संतुलन)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/frontend/css/tokens.css" />
  <link rel="stylesheet" href="/frontend/css/components.css" />
  <link rel="stylesheet" href="/frontend/css/animations.css" />
  <link rel="stylesheet" href="/frontend/css/shell.css" />
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); padding: var(--space-4);">

  <div class="card card-lg" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-xl); border-radius: var(--radius-2xl);">
    
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <span style="font-size: 2.2rem; display: block; margin-bottom: 6px;">🔑</span>
      <h1 style="font-size: 1.4rem; margin-bottom: 4px;">Forgot Your Password?</h1>
      <p style="font-size: 0.9rem; color: var(--text-secondary);">Enter your student email and we'll send a secure password reset link.</p>
    </div>

    <div id="forgot-alert" class="alert alert-info" style="display: none;"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label" for="forgot-email">Account Email</label>
        <input type="email" id="forgot-email" class="form-input" placeholder="alex@university.edu" required />
      </div>

      <button type="submit" class="btn btn-primary" id="forgot-btn" style="width: 100%; min-height: 48px; font-size: 1rem;">
        <span>Send Reset Link</span>
        <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: var(--space-6); font-size: 0.9rem; color: var(--text-secondary); border-top: 1px solid var(--border-subtle); padding-top: var(--space-5);">
      Remembered your password? <a href="/login" style="color: var(--sage-dark); font-weight: 700; text-decoration: underline;">Back to Sign In</a>
    </div>

  </div>

  <script src="/frontend/js/api.js"></script>
  <script>
    const form = document.getElementById("forgot-form");
    const alertBox = document.getElementById("forgot-alert");
    const btn = document.getElementById("forgot-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = "<span>Generating token...</span>";
      const email = document.getElementById("forgot-email").value.trim();

      try {
        const res = await window.api.forgotPassword(email);
        alertBox.className = "alert alert-success";
        alertBox.innerHTML = `Password reset instructions ready!<br />For student local testing, click below:<br /><a href="/reset-password?token=${res.reset_token || 'demo_token'}" style="text-decoration: underline; font-weight: 700; color: var(--sage-dark);">Click here to Reset Password Now</a>`;
        alertBox.style.display = "block";
        btn.style.display = "none";
      } catch (err) {
        alertBox.className = "alert alert-warning";
        alertBox.textContent = err.message || "Failed to initiate reset.";
        alertBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = `<span>Send Reset Link</span><i data-lucide="mail" style="width: 18px; height: 18px;"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
