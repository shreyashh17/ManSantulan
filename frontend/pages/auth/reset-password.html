<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — ManSantulan (मन संतुलन)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/frontend/css/tokens.css" />
  <link rel="stylesheet" href="/frontend/css/components.css" />
  <link rel="stylesheet" href="/frontend/css/animations.css" />
  <link rel="stylesheet" href="/frontend/css/shell.css" />
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); padding: var(--space-4);">

  <div class="card card-lg" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-xl); border-radius: var(--radius-2xl);">
    
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <span style="font-size: 2.2rem; display: block; margin-bottom: 6px;">🔐</span>
      <h1 style="font-size: 1.4rem; margin-bottom: 4px;">Choose a New Password</h1>
      <p style="font-size: 0.9rem; color: var(--text-secondary);">Enter a secure new password for your ManSantulan account.</p>
    </div>

    <div id="reset-alert" class="alert alert-warning" style="display: none;"></div>

    <form id="reset-form">
      <input type="hidden" id="reset-token-input" />

      <div class="form-group">
        <label class="form-label" for="new-pw">New Password</label>
        <input type="password" id="new-pw" class="form-input" placeholder="Minimum 8 characters" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-pw">Confirm New Password</label>
        <input type="password" id="confirm-pw" class="form-input" placeholder="Repeat your new password" required />
      </div>

      <button type="submit" class="btn btn-primary" id="reset-btn" style="width: 100%; min-height: 48px; font-size: 1rem;">
        <span>Update Password</span>
        <i data-lucide="check" style="width: 18px; height: 18px;"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: var(--space-6); font-size: 0.9rem; color: var(--text-secondary); border-top: 1px solid var(--border-subtle); padding-top: var(--space-5);">
      <a href="/login" style="color: var(--sage-dark); font-weight: 700; text-decoration: underline;">Back to Sign In</a>
    </div>

  </div>

  <script src="/frontend/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token") || "demo_token";
    document.getElementById("reset-token-input").value = token;

    const form = document.getElementById("reset-form");
    const alertBox = document.getElementById("reset-alert");
    const btn = document.getElementById("reset-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";

      const p1 = document.getElementById("new-pw").value;
      const p2 = document.getElementById("confirm-pw").value;

      if (p1 !== p2) {
        alertBox.textContent = "Passwords do not match. Please re-enter.";
        alertBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "<span>Updating...</span>";

      try {
        await window.api.resetPassword(token, p1);
        alertBox.className = "alert alert-success";
        alertBox.innerHTML = `Password successfully updated! Redirecting to login...`;
        alertBox.style.display = "block";
        setTimeout(() => window.location.href = "/login", 1500);
      } catch (err) {
        alertBox.className = "alert alert-warning";
        alertBox.textContent = err.message || "Failed to reset password.";
        alertBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = `<span>Update Password</span><i data-lucide="check" style="width: 18px; height: 18px;"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
